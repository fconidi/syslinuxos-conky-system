conky.config = {
    alignment = 'middle_right',
    background = false,
    double_buffer = true,
    update_interval = 1,
    cpu_avg_samples = 2,
    net_avg_samples = 2,
    no_buffers = true,
    short_units = true,
    pad_percents = 2,
    top_name_width = 14,
    text_buffer_size = 8192,
    override_utf8_locale = true,
    use_xft = true,
    font = 'DejaVu Sans Mono:size=@FONT@',
    xftalpha = 1,
    default_color = '0abff7',
    color1 = 'FFFFFF',
    color2 = 'D1CDD5',
    color3 = 'ffaa00',
    color4 = 'ff4444',
    draw_shades = false,
    draw_outline = false,
    draw_borders = false,
    draw_graph_borders = false,
    own_window = true,
    own_window_type = 'normal',
    own_window_class = 'Conky-System',
    own_window_title = 'Conky-System',
    own_window_transparent = true,
    own_window_argb_visual = true,
    own_window_argb_value = 0,
    own_window_colour = '000000',
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    border_inner_margin = 0,
    border_outer_margin = 0,
    border_width = 0,
    minimum_width = @WIDTH@,
    maximum_width = @WIDTH@,
    gap_x = @GAP_X@,
    gap_y = @GAP_Y@,
};

conky.text = [[
+-- ${color1}Conky-System${color}
|   ${color2}${nodename}${color}${alignr}${time %H:%M}
|
+-- ${color1}System${color}
|   +-- OS ${color2}${alignr}@OS_NAME@${color}
|   +-- Kernel ${color2}${alignr}${kernel}${color}
|   +-- Machine ${color2}${alignr}${machine}${color}
|   +-- Uptime ${color2}${alignr}${uptime_short}${color}
|
+-- ${color1}Memory${color}
|   +-- Total ${color2}${alignr}${memmax}${color}
|   +-- Used ${alignr}${if_match ${memperc}>80}${color4}${else}${if_match ${memperc}>60}${color3}${else}${color2}${endif}${endif}${mem} (${memperc}%)${color}
|   +-- Free ${color2}${alignr}${memfree}${color}
|   +-- Available ${color2}${alignr}${memeasyfree}${color}
|   +-- Swap ${color2}${alignr}${swap} / ${swapmax}${color}
|
+-- ${color1}Status${color}
|   +-- CPU ${color2}${alignr}${cpu}% / ${freq_g} GHz${color}
|   +-- Load ${color2}${alignr}${loadavg}${color}
|   +-- Disk I/O ${color2}${alignr}${diskio}${color}
|       +-- Read ${color2}${alignr}${diskio_read}${color}
|       +-- Write ${color2}${alignr}${diskio_write}${color}
|
+-- ${color1}Storage (free)${color}
|   +-- /ROOT ${color2}${alignr}${fs_free /} / ${fs_size /}${color}
|   +-- /HOME ${color2}${alignr}${fs_free /home} / ${fs_size /home}${color}
|
+-- ${color1}Processes${color}
|   +-- Total ${color2}${processes}${color}${alignr}Running ${color2}${running_processes}${color}
|   +-- CPU ${alignr}${color1}CPU%   MEM%${color}
|   |   +-- ${color2}${top name 1}${alignr}${top cpu 1}  ${top mem 1}${color}
|   |   +-- ${color2}${top name 2}${alignr}${top cpu 2}  ${top mem 2}${color}
|   |   +-- ${color2}${top name 3}${alignr}${top cpu 3}  ${top mem 3}${color}
|   +-- Memory ${alignr}${color1}CPU%   MEM%${color}
|       +-- ${color2}${top_mem name 1}${alignr}${top_mem cpu 1}  ${top_mem mem 1}${color}
|       +-- ${color2}${top_mem name 2}${alignr}${top_mem cpu 2}  ${top_mem mem 2}${color}
|       +-- ${color2}${top_mem name 3}${alignr}${top_mem cpu 3}  ${top_mem mem 3}${color}
|
${execpi 5 @HELPER@ network}
|   +-- External IP ${color2}${alignr}${execi 300 @HELPER@ public-ip}${color}
|   +-- ISP ${color2}${alignr}${execi 3600 @HELPER@ isp}${color}
]];
